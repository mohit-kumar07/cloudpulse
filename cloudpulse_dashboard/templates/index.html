<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CloudPulse Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; }
    .card { margin-bottom: 16px; }
  </style>
</head>
<body>
  <section class="section">
    <div class="container">
      <h1 class="title">CloudPulse — Live Dashboard</h1>
      <p class="subtitle">Real-time infrastructure performance monitor</p>

      <div class="columns">
        <div class="column is-two-thirds">
          <div class="card">
            <header class="card-header"><p class="card-header-title">System Metrics</p></header>
            <div class="card-content">
              <p>Charts loading...</p>
            </div>
          </div>
        </div>

        <div class="column">
          <div class="card">
            <header class="card-header"><p class="card-header-title">Latest Metrics</p></header>
            <div class="card-content">
              <div id="latest">Loading...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
